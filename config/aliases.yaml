# ============================================================
# 别名归一化字典
# 由 parser/cleaner.py 与 parser/rules.py 读取，用于把同一含义的
# 多种写法收敛到统一取值，降低后续统计与去重的噪声。
# 约定：key 为归一化后的标准值，value 为别名列表
# ============================================================

# ---------- 城市 ----------
cities:
  北京: [北京市, 北京朝阳, 北京海淀, 京]
  上海: [上海市, 上海浦东, 沪]
  广州: [广州市, 广州天河, 穗]
  深圳: [深圳市, 深圳南山, 深]
  杭州: [杭州市, 杭州滨江]
  成都: [成都市, 蓉]
  武汉: [武汉市, 汉口, 武昌]
  西安: [西安市, 长安]
  南京: [南京市, 金陵]
  远程: [remote, 远程办公, 居家办公, 可远程]

# ---------- 学历 ----------
education:
  不限: [无要求, 学历不限, 不限制, 无]
  初中及以下: [初中, 小学]
  高中: [高中及以下, 中专, 中技, 职高]
  大专: [专科, 高职, 大专及以上]
  本科: [学士, 本科及以上, 统招本科, 全日制本科]
  硕士: [研究生, 硕士研究生, 硕士及以上]
  博士: [博士研究生, 博士后]

# ---------- 经验 ----------
experience:
  不限: [经验不限, 无经验要求, 应届, 应届生]
  1年以下: [一年以下, 1年以内, 无经验]
  1-3年: [一到三年, 1-3, 1年-3年]
  3-5年: [三到五年, 3-5, 3年-5年]
  5-10年: [五到十年, 5-10, 5年-10年]
  10年以上: [十年以上, 10年+, 资深]

# ---------- 公司规模 ----------
company_size:
  20人以下: [0-20人, 少于20人, 微型企业]
  20-99人: [20-99, 小型企业]
  100-499人: [100-499, 中型企业]
  500-999人: [500-999]
  1000-9999人: [1000人以上, 大型企业]
  10000人以上: [万人以上, 超大型企业]

# ---------- 公司性质 / 行业 ----------
company_type:
  国企: [国有企业, 央企, 国有]
  民营: [民营企业, 私企, 股份制]
  外企: [外资企业, 外商独资, 合资, 中外合资]
  事业单位: [事业编, 机关单位]
  上市公司: [已上市, IPO]

# ---------- 薪资 / 单位 ----------
salary:
  单位:
    K: [k, 千, 千元]
    W: [w, 万, 万元]
    元: [元/月, 元每月, RMB]
  面议: [薪资面议, 面谈, 待遇面议, 详见岗位]
  日结: [日薪, 按天结算]
  时薪: [小时薪资, 按小时结算]

# ---------- 其他 ----------
booleans:
  true: [是, 有, Y, yes, true, 1]
  false: [否, 无, N, no, false, 0]
