# ============================================================
# 别名 / 词表归一化字典（一级规则抽取的数据源）
#
# 结构：{分组名: {标准值: [别名...]}}
#   * 匹配按别名长度从长到短进行，避免长词被短词截断；
#   * 标准值即写入 JobRecord 的最终取值；
#   * 标了「【本人确认】」的分组必须由本人按本校门户实际表述补全/删减，
#     否则会引入误召（例如把「北京」错配到「北京大学」这类单位名）。
# ============================================================

# ---------- 届别（标准值 = 四位年份） ----------
graduation_year:
  2026: ["2026届", "26届", "二〇二六届"]
  2025: ["2025届", "25届", "二〇二五届"]
  2024: ["2024届", "24届", "二〇二四届"]
  2023: ["2023届", "23届", "二〇二三届"]
  2022: ["2022届", "22届", "二〇二二届"]

# ---------- 年级 ----------
grade:
  应届: ["应届毕业生", "应届生", "当年毕业"]
  大四: ["本科四年级", "四年级", "大四在读"]
  大三: ["本科三年级", "三年级", "大三在读"]
  大二: ["本科二年级", "二年级"]
  大一: ["本科一年级", "一年级"]
  研三: ["研究生三年级", "硕士三年级", "研三在读"]
  研二: ["研究生二年级", "硕士二年级"]
  研一: ["研究生一年级", "硕士一年级"]

# ---------- 学历 ----------
degree:
  博士: ["博士研究生", "博士生", "Ph.D", "PhD", "博士毕业"]
  硕士: ["硕士研究生", "研究生", "硕士生", "全日制硕士", "学术硕士", "专业硕士"]
  本科: ["本科生", "学士", "全日制本科", "统招本科", "本科毕业"]
  大专: ["专科", "高职", "大专生", "专科毕业"]
  专升本: ["专转本", "专升本毕业"]

# ---------- 专业（【本人确认】需按本校专业目录补全） ----------
