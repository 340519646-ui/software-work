<div class="article">
  <h1 class="title">2025届毕业生张三的求职分享</h1>
  <div class="info">
    <span class="date">发布时间：2025-06-12</span>
    <span class="source">来源：计算机学院</span>
  </div>
  <div class="content">
    <p>我是计算机学院<strong>软件工程</strong>专业的<strong>2025届</strong>本科毕业生，<strong>大四</strong>上学期开始准备秋招。
       本科期间我做过两个后端项目，也在实验室待了两年，这些经历在面试里被反复问到。</p>
    <p>秋招一共投了三十多家，最后<strong>签约北京</strong>的<strong>某某科技有限公司</strong>，<strong>担任算法工程师</strong>，
       主要做推荐系统的召回方向。这里给学弟学妹三点建议：早准备、多投递、认真复盘。</p>
    <p>关于城市的选择，我最终选择了北京，原因是岗位机会多、成长快；如果更看重生活成本，
       杭州、成都也是不错的选择。</p>
  </div>
  <div class="footer">（供稿：张三　审核：就业指导中心）</div>
</div>
